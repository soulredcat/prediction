services:
  prediction:
    build: .
    environment:
      API_ADDR: ":8080"
      DATA_FILE: /app/data/btc_prices.json
      MODEL_FILE: /app/data/model_config.json
    volumes:
      - ./data/btc_prices.json:/app/data/btc_prices.json:ro
      - ./data/model_config.json:/app/data/model_config.json
    ports:
      - "8080:8080"
    restart: unless-stopped
