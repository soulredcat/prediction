<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BTC Cycle Prediction</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow">BITCOIN TIME-CYCLE RESEARCH</p>
        <h1>BTC Price & Cycle Chart</h1>
        <p id="chart-meta" class="subtitle">Loading repository data…</p>
      </div>

      <div class="chart-actions" aria-label="Chart controls">
        <button id="zoom-out" type="button" title="Zoom out">−</button>
        <button id="zoom-in" type="button" title="Zoom in">+</button>
        <button id="fit-history" type="button">Fit history</button>
        <button id="go-data-end" type="button">Data end</button>
        <button id="go-2200" type="button">Year 2200</button>
        <button id="toggle-fullscreen" type="button">Full screen</button>
      </div>
    </header>

    <section class="status-strip" aria-label="Chart status">
      <span><strong id="model-status">—</strong></span>
      <span><strong id="data-status">—</strong></span>
      <span><strong id="zoom-status">—</strong></span>
      <span class="legend-item"><i class="legend-line price-legend"></i>Actual BTC price</span>
      <span class="legend-item"><i class="legend-line ath-legend"></i>ATH</span>
      <span class="legend-item"><i class="legend-line low-legend"></i>Low</span>
    </section>

    <div id="error" class="error hidden"></div>

    <section class="chart-stage" aria-label="Bitcoin price and cycle chart">
      <div id="chart-empty" class="empty hidden">The static BTC price dataset is empty.</div>
      <div id="chart-viewport" class="chart-viewport" tabindex="0" aria-label="Scrollable and zoomable Bitcoin chart through year 2200">
        <div id="chart-canvas" class="chart-canvas"></div>
      </div>
    </section>
  </main>
</body>
</html>
